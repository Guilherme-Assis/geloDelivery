<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5fbff">
    <meta name="description" content="Conheça a JogGelo, uma vitrine de gelos saborizados para drinks.">
    <title>JogGelo — Gelo para drinks</title>
    <style id="expo-reset">
      html, body, #root { height: 100%; }
      body { margin: 0; overflow: hidden; background: #f5fbff; }
      #root { display: flex; }
      #hero {
        background: radial-gradient(ellipse at 73% 43%, #66d0f4, #a8e7fb 31%, #e2f6ff 60%, #f6fcff 89%);
      }
      #hero::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: .43;
        background-image: linear-gradient(#0076a641 1px, transparent 1px),
          linear-gradient(90deg, #0076a641 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: linear-gradient(90deg, transparent 3%, #0009 52%, #000);
      }
      @media (hover: hover) and (prefers-reduced-motion: no-preference) {
        [data-flavor-card="true"] { transition: transform .2s, border-color .2s; }
        [data-flavor-card="true"]:hover { transform: translateY(-4px); border-color: #049dd6; }
      }
      a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
        outline: 2px solid #006e9e;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <noscript>Ative o JavaScript para acessar o catálogo da JogGelo.</noscript>
    <div id="root"></div>
  </body>
</html>
